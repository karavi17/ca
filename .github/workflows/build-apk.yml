name: Build TECHI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          echo "Starting TECHI APK build..."
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find generated APK
        run: |
          echo "Searching for generated APK files..."
          find . -type f -name "*.apk" -print

      - name: Verify APK exists
        run: |
          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK file was generated."
            exit 1
          fi
          echo "Found $APK_COUNT APK file(s)."

      - name: Upload TECHI APK
        uses: actions/upload-artifact@v4
        with:
          name: TECHI-APK
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 7
